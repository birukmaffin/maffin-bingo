name: Build MAFFIN BINGO APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create Android project
        run: |
          mkdir -p build/www
          cp -r index.html manifest.webmanifest css js icons build/www/
          cd build
          cat > package.json <<'JSON'
          {
            "name": "maffin-bingo-android",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.1.0",
              "@capacitor/cli": "^6.1.0",
              "@capacitor/core": "^6.1.0",
              "@capacitor/filesystem": "^6.0.0",
              "@capacitor/share": "^6.0.0"
            }
          }
          JSON
          cat > capacitor.config.json <<'JSON'
          { "appId": "com.maffin.bingo", "appName": "MAFFIN BINGO", "webDir": "www", "server": { "androidScheme": "https" } }
          JSON
          npm install
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: build/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MAFFIN-BINGO-apk
          path: build/android/app/build/outputs/apk/debug/app-debug.apk
