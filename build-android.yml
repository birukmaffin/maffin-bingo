name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create Android project
        run: |
          mkdir -p build/www
          cp -r index.html manifest.webmanifest css js icons fonts build/www/
          cd build
          cat > package.json <<'JSON'
          {
            "name": "maffin-bingo-android",
            "version": "1.1.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.1.0",
              "@capacitor/cli": "^6.1.0",
              "@capacitor/core": "^6.1.0",
              "@capacitor/filesystem": "^6.0.0",
              "@capacitor/share": "^6.0.0",
              "@capacitor-community/text-to-speech": "^5.0.0",
              "@fontsource/noto-sans-ethiopic": "^5.0.0"
            }
          }
          JSON
          cat > capacitor.config.json <<'JSON'
          { "appId": "com.maffin.bingo", "appName": "MAFFIN BINGO", "webDir": "www", "server": { "androidScheme": "https" } }
          JSON
          npm install --legacy-peer-deps
          node ../tools/copy-am-fonts.js node_modules www/fonts
          npx cap add android
          npx cap sync android
          cp -r ../android-res/* android/app/src/main/res/
          find android/app/src/main/res -name 'splash.png' -exec cp ../assets/splash.png {} \;
          sed -i 's#</manifest>#    <queries><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent></queries>\n</manifest>#' android/app/src/main/AndroidManifest.xml
      - name: Build debug APK
        working-directory: build/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MAFFIN-BINGO-android
          path: build/android/app/build/outputs/apk/debug/app-debug.apk
